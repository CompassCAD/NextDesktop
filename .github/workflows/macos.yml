name: Build macOS

on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build macOS dmg + zip (unsigned)
        run: yarn build:mac --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Launch app and capture preview
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find dist -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo 'No packaged .app bundle found under dist. Build output:'
            find dist -maxdepth 4 -print || true
            exit 1
          fi
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Contents/Info.plist")"
          open -a "$app_path"
          for attempt in {1..120}; do
            window_count="$(osascript -e "tell application \"System Events\" to count (windows of (first process whose bundle identifier is \"$bundle_id\"))" 2>/dev/null || echo 0)"
            if [[ "$window_count" =~ ^[0-9]+$ ]] && (( window_count > 0 )); then
              break
            fi
            sleep 1
          done
          if ! [[ "$window_count" =~ ^[0-9]+$ ]] || (( window_count == 0 )); then
            echo "App window did not appear within 120 seconds (bundle id: $bundle_id)."
            exit 1
          fi
          osascript -e "tell application \"$bundle_id\" to activate"
          sleep 15
          mkdir -p artifacts
          screencapture -x -l "$(osascript -e 'tell application "System Events" to unix id of first process whose frontmost is true')" artifacts/macos-preview.png
          osascript -e "tell application \"$bundle_id\" to quit" || true

      - name: Upload macOS build and preview
        uses: actions/upload-artifact@v4
        with:
          name: compasscad-macos-preview
          path: |
            dist/*.dmg
            dist/*.zip
            artifacts/macos-preview.png
          if-no-files-found: error
          retention-days: 14
