appId: dev.zeankun.compasscad-next
productName: CompassCAD NEXT
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
asarUnpack:
  - resources/**
win:
  target:
    - target: nsis
      arch:
        - x64
  executableName: CompassCAD
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  identity: null
  artifactName: ${productName}-${version}-${arch}.${ext}
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: we need request to your docs folder, you'll thank me later :)
    - NSDownloadsFolderUsageDescription: we need request to your downloads folder, you'll thank me later :)
  notarize: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
    - target: AppImage
      arch:
        - x64
  maintainer: zeankun
  category: Graphics
  artifactName: ${productName}-${version}-${arch}.${ext}
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: CompassCAD
  repo: NextDesktop
  releaseType: release
  vPrefixedTagName: false
